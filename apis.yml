aid: axitrust
name: axiTrust
description: 'axiTrust is a technology and consulting platform for the Indian surety-bond
  market, connecting IRDAI-licensed insurers, MSMEs, and government procurement bodies.
  Its platform unifies application processing, underwriting checks, and insurance surety
  bond issuance, with dashboards for tracking bonds, partners, and claims, plus integrations
  to financial, legal, banking, and ROC data sources. axiTrust also offers consulting
  services including discovery workshops, economic analysis comparing sureties to bank
  guarantees, and adoption support for enterprises and government departments. It is
  not an insurer or broker; all insurance surety bonds are issued by IRDAI-licensed
  insurance companies. axiTrust is a fintech backed by General Catalyst.'
